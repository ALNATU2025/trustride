name: trustride
description: TrustRide — ride-hailing for Sierra Leone. Rider, driver and admin apps in one Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Phosphor icon fonts (MIT), bundled so icons work on current Flutter.
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
