name: trustride
description: TrustRide — ride-hailing for Sierra Leone. Rider, driver and admin apps in one Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Backend
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  # Maps, location and routing (OpenStreetMap — no API key)
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  http: ^1.2.2
  # Calls, SMS and navigation hand-off
  url_launcher: ^6.3.0
  # Profile photos, app lock (PIN + fingerprint/face)
  image_picker: ^1.1.2
  local_auth: ^3.0.0
  flutter_secure_storage: ">=9.2.2 <12.0.0"
  # Look and feel
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Phosphor icon fonts (MIT), bundled so icons work on current Flutter.
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
